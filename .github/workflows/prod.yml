name: CD Pipeline (prod)

on:
  push:
    branches: [ "prod" ]

env:
  DOCKER_IMAGE: intranet-newdeal
  DOCKER_TAG: ${{ github.sha }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Run Trivy vulnerability scanner (block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Run Gitleaks to check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: security-scan
    runs-on: [self-hosted, runner_prod]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image from Docker Hub
        run: |
          LOWER_USERNAME=$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]' | xargs)
          docker pull "${LOWER_USERNAME}/${DOCKER_IMAGE}:${DOCKER_TAG}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

      - name: Stop and remove old container
        run: |
          docker stop intranet-newdeal || true
          docker rm intranet-newdeal || true

      - name: Run new container on port 80
        run: |
          LOWER_USERNAME=$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]' | xargs)
          docker run -d --name intranet-newdeal \
            --restart unless-stopped \
            -p 80:80 \
            "${LOWER_USERNAME}/${DOCKER_IMAGE}:${DOCKER_TAG}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

  notify:
    needs: [security-scan, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER_ADDRESS }}
          server_port: ${{ secrets.MAIL_SERVER_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: |
            [GitHub Actions] Pipeline CD (${{ github.repository }})
            - Status: ${{ job.status }}
          to: moussawade@groupeisi.com
          from: GitHub Actions
          body: |
            Workflow ${{ github.workflow }} pour le dépôt ${{ github.repository }} s'est terminé avec le statut : ${{ job.status }}.